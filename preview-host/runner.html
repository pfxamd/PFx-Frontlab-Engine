<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PFx Frontlab isolated preview runner</title>
  <style>html,body{margin:0;height:100%;overflow:hidden}#stage{height:100%}#stage>iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <div id="stage"></div>
  <script>
  (() => {
    'use strict';
    const channel = 'pfx-frontlab-bridge';
    const previewChannel = 'pfx-frontlab';
    const stage = document.getElementById('stage');
    let parentOrigin = null;
    let innerFrame = null;
    let currentToken = '';
    let currentRun = 0;
    const isSession = d => !!d && typeof d === 'object' &&
      /^[a-f0-9]{32}$/.test(d.token) && Number.isSafeInteger(d.runId) && d.runId > 0;
    const clear = () => {
      innerFrame?.remove();
      innerFrame = null;
    };
    addEventListener('message', event => {
      const d = event.data;
      if (event.source === parent) {
        if (!d || d.channel !== channel) return;
        if (d.type === 'mount') {
          if (parentOrigin && event.origin !== parentOrigin) return;
          if (!isSession(d) || typeof d.html !== 'string' || d.html.length > 4 * 1024 * 1024) return;
          parentOrigin = event.origin;
          currentToken = d.token;
          currentRun = d.runId;
          const frame = document.createElement('iframe');
          frame.setAttribute('sandbox', 'allow-scripts');
          frame.setAttribute('referrerpolicy', 'no-referrer');
          frame.setAttribute('title', 'Isolated Frontlab user code');
          frame.srcdoc = d.html;
          clear();
          innerFrame = frame;
          stage.append(frame);
          return;
        }
        if (d.type === 'css-patch' && parentOrigin === event.origin &&
            isSession(d) && currentToken === d.token && currentRun === d.runId &&
            typeof d.css === 'string' && d.css.length <= 1024 * 1024) {
          innerFrame?.contentWindow?.postMessage({
            channel: previewChannel, type: 'css-patch',
            token: currentToken, runId: currentRun, css: d.css
          }, '*'); // The nested frame has an opaque origin.
        }
        return;
      }
      if (!innerFrame || event.source !== innerFrame.contentWindow || event.origin !== 'null') return;
      if (!d || d.channel !== previewChannel || !isSession(d) ||
          d.token !== currentToken || d.runId !== currentRun ||
          !['ready', 'css-updated', 'diagnostic'].includes(d.type)) return;
      if (d.type === 'diagnostic' && (!d.diagnostic ||
          !['log','info','warn','error'].includes(d.diagnostic.level) ||
          !['console','runtime','promise','protocol'].includes(d.diagnostic.kind) ||
          typeof d.diagnostic.message !== 'string' || d.diagnostic.message.length > 16384)) return;
      if (parentOrigin) parent.postMessage(d, parentOrigin);
    });
    parent.postMessage({ channel, type: 'runner-ready' }, '*');
  })();
  </script>
</body>
</html>
